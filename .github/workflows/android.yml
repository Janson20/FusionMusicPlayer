name: Android Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "构建类型"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      version:
        description: "可选版本名（不填则读取 app/_version.py）"
        required: false
        default: ""
      publish_release:
        description: "构建后上传 APK 到 GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "publish_release=true 时必填，例如 v1.0.9"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/_version.py").read_text(encoding="utf-8")
          print(re.search(r'APP_VERSION\s*=\s*"([^"]+)"', text).group(1))
          PY
            )
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Android version: $VERSION"

      - name: Prepare release signing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" != "release" ]; then
            echo "Debug build does not need release signing."
            exit 0
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::release 构建需要 secrets.ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::release 构建需要 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mobile/gradlew
          cd mobile
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew --no-daemon :app:assembleRelease -PversionName="${{ steps.version.outputs.value }}"
          else
            ./gradlew --no-daemon :app:assembleDebug -PversionName="${{ steps.version.outputs.value }}"
          fi

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          APK=$(find app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then echo "::error::没有找到 APK"; exit 1; fi
          VERSION="${{ steps.version.outputs.value }}"
          VARIANT="${{ inputs.variant }}"
          NAME="FusionMusicPlayer-${VERSION}-${VARIANT}.apk"
          DEST="$(dirname "$APK")/$NAME"
          cp "$APK" "$DEST"
          (cd "$(dirname "$DEST")" && sha256sum "$NAME" > "$NAME.sha256")
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "checksum=$DEST.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST" "$DEST.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionMusicPlayer-Android-${{ steps.version.outputs.value }}-${{ inputs.variant }}
          path: |
            mobile/${{ steps.apk.outputs.path }}
            mobile/${{ steps.apk.outputs.checksum }}
            mobile/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish APK to Release
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FusionMusicPlayer-Android-${{ needs.build.outputs.version }}-${{ inputs.variant }}
          path: artifact
      - name: Validate tag
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::publish_release=true 时必须填写 release_tag"
            exit 1
          fi
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          VERSION="${{ needs.build.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Fusion Music $VERSION" --notes "Android 构建 $VERSION" --latest
          fi
          find artifact -type f -print
          FILES=$(find artifact -type f \( -name '*.apk' -o -name '*.sha256' -o -name 'mapping.txt' \) | tr '\n' ' ')
          gh release upload "$TAG" $FILES --clobber
