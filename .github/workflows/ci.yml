name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pyflakes
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: pyflakes
        # 只对本项目自有代码做门禁。app/sources/ 下取自 FMCL 的 8 个文件保持
        # 与上游逐字一致（仅改相对导入），其未使用导入属于上游既有情况，不参与检查。
        run: |
          python -m pyflakes \
            main.py \
            app/*.py \
            app/bridges \
            app/core \
            app/security \
            app/sources/__init__.py \
            app/sources/netease.py \
            tests

  test:
    name: Core tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run core regression tests
        # 凭据加密、LRC 解析、播放队列 —— 纯逻辑，不需要显示环境
        run: python tests/test_core.py

  ui-smoke:
    name: QML smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QML smoke test
        # 「设置/登录窗口一启动就弹出来」与「关闭后无法再打开」这两条缺陷
        # 真实出现过，这个用例就是它们的回归网。
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" python tests/test_ui_smoke.py
        env:
          QT_QPA_PLATFORM: xcb
          QT_LOGGING_RULES: "qt.qml.binding.removal.info=false"

  build-check:
    name: PyInstaller build check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Build (onedir)
        run: python -m PyInstaller build.spec --noconfirm --log-level WARN

      - name: Verify the packaged app boots and loads QML
        shell: pwsh
        run: |
          $exe = "dist\FusionMusicPlayer\FusionMusicPlayer.exe"
          if (-not (Test-Path $exe)) { throw "未生成可执行文件: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 25
          if ($proc.HasExited) {
            throw "打包后的程序提前退出，退出码 $($proc.ExitCode)"
          }
          $log = "dist\FusionMusicPlayer\data\logs\fusion.log"
          if (Test-Path $log) {
            Write-Host "--- 日志尾部 ---"
            Get-Content $log -Encoding UTF8 -Tail 15
            if (Select-String -Path $log -Pattern "QML:" -Quiet) {
              throw "打包后的程序出现 QML 告警，详见上面的日志"
            }
          } else {
            Write-Host "未生成日志文件，跳过日志检查"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "打包产物启动正常"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-check-logs
          path: dist/FusionMusicPlayer/data/logs/
          if-no-files-found: ignore
          retention-days: 7
