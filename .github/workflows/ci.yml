name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: pyflakes
        # 只对本项目自有代码做门禁。app/sources/ 下取自 FMCL 的 8 个文件保持
        # 与上游逐字一致（仅改相对导入），其未使用导入属于上游既有情况，不参与检查。
        run: |
          python -m pyflakes \
            main.py \
            app/*.py \
            app/bridges \
            app/core \
            app/security \
            app/sources/__init__.py \
            app/sources/netease.py \
            scripts \
            tests \
            tools

      - name: Core regression tests
        run: python tests/test_core.py

      - name: QML 信号处理器检查
        # 拦住已废弃的信号参数注入（Qt 6.7+ 会报
        # 'Parameter "x" is not declared'）。这个检查纯静态、不需要 Qt 运行时，
        # 却能覆盖所有 QML 文件 —— ui-smoke 只在本地跑，这条得留在 CI 里。
        run: python tools/check_qml_signals.py
